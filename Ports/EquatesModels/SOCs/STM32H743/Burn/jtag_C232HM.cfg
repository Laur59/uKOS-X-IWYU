#
# Goal:		script for burning the arm flash via the openocd.
#			Cable C232HM
#			Full jtag transport
#
#			- Usage:
#			  sh jtag_C232HM.sh

# - Operate with the cable C232HM (0x0403 0x6014)
# - JTAG on the channel B (1)
#                TMS TDO TDI CLK             TMS TDO TDI CLK
# - GPIO, data = 1   0   0   0, Directions = O   I   O   O

adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi layout_init 0x0008 0x000b

transport select jtag

source [find target/stm32h7x_dual_bank.cfg]
adapter speed 100
reset_config none

program ./FLASH.elf verify reset exit
