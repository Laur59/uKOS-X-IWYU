# Target list consumed by _build.sh, _clean.sh and run-regression.sh.
#
# Each entry under a board key accepts:
#   name:       mandatory - the variant directory is Variant_<name>
#   core:       mandatory - arm | riscv, the architecture family. Read by
#               Tools/Developer/clangd-target.sh to select a clangd binary.
#   cmake_core: optional  - CMake CORE value, for a board that builds several
#               architectures out of a single variant directory. When present,
#               _build.sh adds -DCORE=<value>, writes into Artefacts-<value>/
#               and labels the row Variant_<name>-<value>. Only Pico2_rp2350
#               (Cortex-M33 by default, Hazard3 RV32IMAC) uses it.

Alastor_H743:
  - name: Test
    core: arm

Discovery_N657:
  - name: Test
    core: arm

Discovery_U5G9:
  - name: Test
    core: arm

Nucleo_F207:
  - name: Test
    core: arm

Nucleo_H743:
  - name: Test
    core: arm

Nucleo_L4R5:
  - name: Test
    core: arm

Nucleo_N657:
  - name: Test
    core: arm

Longan_Nano_F103:
  - name: Test
    core: riscv

Firefly_H743:
  - name: Test
    core: arm

# Multicores asymmetric
Asmodee_H747:
  - name: Test_CM4
    core: arm
  - name: Test_CM7
    core: arm

DevKit_nRF5340:
  - name: Test_Net
    core: arm
  - name: Test_App
    core: arm

# Multicores symmetric
MAiXDUiNO_K210:
  - name: Test
    core: riscv

Pico2_rp2350:
  - name: Test
    core: arm
  - name: Test
    core: riscv
    cmake_core: RV32IMAC
